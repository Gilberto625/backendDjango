<div class="home-container">
  <mat-toolbar color="primary" class="toolbar">
    <span>Mi Aplicación</span>
    <span class="spacer"></span>
    <button mat-icon-button (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <div class="content">
    <mat-card class="welcome-card">
      <mat-card-header>
        <mat-card-title>¡Bienvenido!</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div class="user-info">
          <h2>Hola, {{ currentUser?.username }}!</h2>
          <p><strong>Email:</strong> {{ currentUser?.email }}</p>
          <p><strong>ID de Usuario:</strong> {{ currentUser?.id }}</p>
        </div>

        <div class="success-message">
          <mat-icon class="success-icon">check_circle</mat-icon>
          <p>Has iniciado sesión exitosamente</p>
        </div>

        <div class="features">
          <h3>Características de tu cuenta:</h3>
          <ul>
            <li>✅ Autenticación 2FA activada</li>
            <li>✅ Sesión segura</li>
            <li>✅ Protección con CSRF tokens</li>
          </ul>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="warn" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Cerrar Sesión
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
